<html>
<head>
<title> Animation </title>
<style>
    .box{
          width:100px;
          height:100px
          background-color:blue;

          animation: moveBox 3s infinite; 

}
   @keyframes moveBox{
    from {transform: translateX(0);}
    to {transform: translateX(200px);}
}
</style>
</head>
<body>
<h1>CSS Transition in Background </h1>
<div class="box"></div>
</body>
</html>
